name: SonarQube Integration

on:
  push:
    branches:
      - main

jobs:
  sonarqube:
    name: SonarQube Integration
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repository
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Ensure full history for analysis

      # Step 2: Set up SonarQube properties (optional, if you want to override properties in the file)
      # In most cases, you can skip this if you have all the necessary properties in the sonar-project.properties file.
      - name: Set up SonarQube properties
        run: |
          echo "sonar.projectKey=your_project_key" >> sonar-project.properties
          echo "sonar.projectName=Your Project Name" >> sonar-project.properties
          echo "sonar.projectVersion=1.0" >> sonar-project.properties
          echo "sonar.sources=src" >> sonar-project.properties
          echo "sonar.host.url=${{ secrets.SONAR_HOST_URL }}" >> sonar-project.properties
          echo "sonar.login=${{ secrets.SONAR_TOKEN }}" >> sonar-project.properties

      # Step 3: Run SonarQube Scan
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          args: "-Dsonar.projectKey=your_project_key"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
