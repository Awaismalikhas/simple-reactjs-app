name: SonarQube Integration

on:
  push:
    branches:
      - master

jobs:
  sonarqube:
    name: SonarQube Integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up SonarQube properties
        run: |
          echo "sonar.projectKey=your_project_key" >> sonar-project.properties
          echo "sonar.projectName=Your Project Name" >> sonar-project.properties
          echo "sonar.projectVersion=1.0" >> sonar-project.properties
          echo "sonar.sources=src" >> sonar-project.properties
          echo "sonar.host.url=${{ secrets.SONAR_HOST_URL }}" >> sonar-project.properties
          echo "sonar.login=${{ secrets.SONAR_TOKEN }}" >> sonar-project.properties

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          args: "-X -Dsonar.projectKey=your_project_key"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
